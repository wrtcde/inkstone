name = "inkstone"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "aef22058-ac80-48f3-96e2-cba9e8e22bd0"

[[kv_namespaces]]
binding = "FILES_KV"
id = "3b77448ba3a14e62bee9a9681a356d70"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "337196fc0efa42059ea6ce88f20e7040"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"

[observability]
enabled = true
